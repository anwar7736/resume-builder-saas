services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEST_API_URL: http://api:3001
        NEST_API_ALLOW_INTERNAL_HTTP: "true"
        NEXT_OUTPUT_STANDALONE: "true"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEST_API_URL: http://api:3001
      NEST_API_ALLOW_INTERNAL_HTTP: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
