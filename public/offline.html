<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5c4bd8" />
    <title>You're offline | ResumeCraft AI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #fbfaf8;
        color: #22211f;
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 440px; }
      img { width: 56px; height: 56px; }
      h1 { margin: 24px 0 8px; font-size: 28px; line-height: 1.2; }
      p { color: #706e69; }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        padding: 13px 20px;
        background: #5c4bd8;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Check your internet connection and try again. Pages you’ve already visited may still be available.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
